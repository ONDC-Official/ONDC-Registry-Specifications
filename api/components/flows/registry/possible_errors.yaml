summary: List of possible errors
details:
  - description: >- 
      Subscriber ID not whitelisted by ONDC
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },
            "error": {
                "type": "POLICY-ERROR",
                "code": "132",
                "path": null,
                "message": "Subscriber Id is not whitelisted"
            }
        }
      </pre>
      <b> Resolution: Please connect with ONDC (techsupport@ondc.org) and get your subscriber ID whitelisted</b>
  - description: >- 
      Timestamp is invalid
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
                "type": "POLICY-ERROR",
                "code": "132",
                "path": null,
                "message": "Timestamp is invalid"
            }

        }
      </pre>
      <b> Resolution: Need to put timestamp within the stipulated timegap defined by ONDC.</b>    
  - description: >- 
      Domain Verification Failed
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
              "type": "POLICY-ERROR",
              "code": "132",
              "path": null,
              "message": "Domain verification is failed"
            }

        }
      </pre>
      <b> Resolution: The signature generated with signing private key and request id should be put into ondc-site-verification.html (signed using ed25519 algorithm without hashing)</b>
  - description: >- 
      Subscriber ID already exists
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
              "type": "POLICY-ERROR",
              "code": "132",
              "path": null,
              "message": "Subscriber id already exists"
            }

        }
      </pre>
      <b> Resolution: If the subscriber ID is already registered with ONDC, this error will be thrown.</b>
  - description: >- 
      OCSP Failed
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
              "type": "POLICY-ERROR",
              "code": "132",
              "path": null,
              "message": "OCSP failed"
            }

        }
      </pre>
      <b> Resolution: Need to get a valid SSL certificate for the purchased domain.</b>
  - description: >- 
      Encryption Verification Failed
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
              "type": "POLICY-ERROR",
              "code": "132",
              "path": null,
              "message": "https://pilot-gateway-1.beckn.nsdl.co.in/option1/test/on_subscribe : Encryption verification is failed"
            }

        }
      </pre>
      <b> Resolution: Utilize the encrypted private key and ONDC public key, then process the challenge received in the on_subscribe callback. Respond synchronously by providing the decrypted value.</b>                    
  - description: >- 
      Incorrect Network participant details provided
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
              "type": "POLICY-ERROR",
              "code": "132",
              "path": null,
              "message": "Please provide valid Network Participant [0] Type"
            }

        }
      </pre>
      <b> Resolution: Incorrect JSON Type Specification: For example, in Option 1, if the Network Participant is registering and the type is set to sellerApp, the aforementioned error will occur. The value should align with the specified options. Option 3 Flag Misalignment: Instead of setting MSN to true, it has been incorrectly set as false, and vice versa for non-MSN cases where the flag is inaccurately set to true.</b>                    
  - description: >- 
      Network participant's ondc-site-verification.html's encrypted signature verification failed
      <pre style="background-color:#f6f8fa">
        {
            "message": {
                "ack": {
                    "status": "NACK"
                }
            },

            "error": {
              "type": "POLICY-ERROR",
              "code": "132",
              "path": null,
              "message": "https://{{netowrk_participant_subsctiber_id}} : Domain verification is failed"
            }

        }
      </pre>
      <b> Resolution: Utilize Plain Request_ID: Network Participants are advised to use the request_id as is, without applying any hashing, when generating the signature. Maintain Consistent Request_ID: Network Participants should ensure the request_id in the request body matches the one used during signature generation to guarantee successful validation. Verify Signing Public Key: Network Participants should include the same signing public key in the request body that corresponds to the signing private key used during the signing process.</b>                    
             
      




  